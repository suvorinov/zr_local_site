# nginx.conf — Reverse proxy для корпоративного портал
# Пример конфигурации для HTTPS (TLS)

# HTTP -> HTTPS редирект
server {
    listen 80;
    server_name informer.your-company.local;
    return 301 https://$host$request_uri;
}

# Основной сервер с TLS
server {
    listen 443 ssl http2;
    server_name informer.your-company.local;

    # --- TLS сертификаты ---
    # Для самоподписанных (внутренняя сеть):
    #   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
    #       -keyout /etc/ssl/private/informer.key \
    #       -out /etc/ssl/certs/informer.crt \
    #       -subj "/CN=informer.your-company.local"
    #
    # Для Let's Encrypt (публичный домен):
    #   certbot --nginx -d informer.your-company.local

    ssl_certificate     /etc/ssl/certs/informer.crt;
    ssl_certificate_key /etc/ssl/private/informer.key;

    # Безопасные TLS-настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Безопасные заголовки ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Rate limiting для админки ---
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

    location /admin {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Основной прокси ---
    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Кэширование статики
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            proxy_pass http://127.0.0.1:8800;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- Запрет доступа к скрытым файлам ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Логи
    access_log /var/log/nginx/informer_access.log;
    error_log  /var/log/nginx/informer_error.log;
}
